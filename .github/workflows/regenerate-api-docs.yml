name: Regenerate PanDA API docs

on:
  schedule:
    # every 6 hours, on the hour (UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# don't let two runs race on the same push
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout panda-docs
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # openapi_generator.py's own deps; not in requirements.txt since that
      # file is only for the Sphinx/ReadTheDocs build
      - name: Install Python dependencies
        run: pip install pyyaml docstring_parser

      # clones panda-server, statically parses pandaserver/api/**, writes
      # panda_api.yaml here and renders ../_static/panda_api.html
      - name: Generate API spec and docs
        working-directory: docs/source/api_specs
        run: bash api_doc.sh

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/source/api_specs/panda_api.yaml docs/source/_static/panda_api.html
          if git diff --cached --quiet; then
            echo "No changes to the generated API docs."
            exit 0
          fi
          git commit -m "Regenerate PanDA API docs"
          git push
